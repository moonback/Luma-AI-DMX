# Quality gate on every push and pull request (Windows, the only packaged platform for now).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly E2E and performance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check-commits needs the base branch history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Conventional Commits
        if: github.event_name == 'pull_request'
        run: node scripts/check-commits.mjs origin/${{ github.base_ref }} HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/coverage-summary.json
          if-no-files-found: ignore

  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/

  perf:
    # Timing-sensitive on shared runners: reported, not blocking, until LUMA-007 is closed.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:perf
