appId: ai.luma.dmx
productName: Luma AI DMX
directories:
  output: release
  buildResources: resources
files:
  - out/**
  # Window icon, referenced at runtime by the main process (?asset import).
  - resources/icon.png
  - package.json
# Native serial-port bindings must stay outside the asar archive.
asarUnpack:
  - node_modules/@serialport/**
# Updates: electron-updater reads latest.yml (stable) or beta.yml (pre-releases such as 0.3.0-beta.1).
publish:
  provider: github
  owner: moonback
  repo: Luma-AI-DMX
generateUpdatesFilesForAllChannels: true
# Code signing: set CSC_LINK (base64 .pfx or URL) and CSC_KEY_PASSWORD in the release job; without them the
# installer is built unsigned and SmartScreen warns on first launch.
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # No spaces: GitHub turns them into dots on upload, which breaks the url in latest.yml.
  artifactName: Luma-AI-DMX-Setup-${version}.${ext}
# macOS and Linux targets are not built in CI yet: they come back once Windows is stable
# (report level 2, item 16), so that nothing is promised that has never been built.
